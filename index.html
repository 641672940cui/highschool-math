<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>东东 · 数学工具箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f6f8fa;
            padding: 20px 16px 40px;
            color: #0b1a2f;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .sub {
            font-size: 14px;
            color: #3b4a5e;
            margin-bottom: 20px;
            padding-left: 12px;
            border-left: 4px solid #2563eb;
            background: #eef2ff;
            border-radius: 0 12px 12px 0;
            padding: 6px 12px;
        }

        .chapter-section {
            margin-bottom: 16px;
        }
        .chapter-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid #e6edf4;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: 0.15s;
            user-select: none;
        }
        .chapter-header:active {
            background: #f1f5f9;
            transform: scale(0.98);
        }
        .chapter-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chapter-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .ch1-icon {
            background: #eef2ff;
        }
        .ch2-icon {
            background: #f3e8ff;
        }
        .ch3-icon {
            background: #d1fae5;
        }
        .chapter-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .chapter-title {
            font-weight: 700;
            font-size: 16px;
            color: #0b1a2f;
        }
        .chapter-progress {
            font-size: 12px;
            color: #64748b;
        }
        .chapter-arrow {
            font-size: 16px;
            color: #94a3b8;
            transition: transform 0.3s;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .chapter-arrow.open {
            transform: rotate(90deg);
        }
        .module-list {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.4s ease;
            padding: 0 4px;
        }
        .module-list.open {
            max-height: 2000px;
        }
        .module-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 8px;
        }
        .module-card {
            background: #fff;
            border-radius: 14px;
            padding: 12px 14px;
            border: 1px solid #e6edf4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: #0b1a2f;
            transition: 0.15s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
        }
        .module-card:active {
            background: #f1f5f9;
            transform: scale(0.98);
        }
        .module-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .module-title {
            font-weight: 600;
            font-size: 15px;
        }
        .module-desc {
            font-size: 12px;
            color: #64748b;
        }
        .module-tag {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 30px;
            font-weight: 500;
            white-space: nowrap;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .module-tag.done {
            background: #bbf7d0;
            color: #065f46;
        }
        .tag-core {
            background: #dbeafe;
            color: #1e4f8a;
        }
        .tag-exam {
            background: #fef3c7;
            color: #92400e;
        }
        .tag-tool {
            background: #e0e7ff;
            color: #3730a3;
        }
        .tag-hard {
            background: #fce4ec;
            color: #b91c1c;
        }
        .tag-basic {
            background: #dbeafe;
            color: #1e4f8a;
        }
        .tag-advance {
            background: #fef3c7;
            color: #92400e;
        }
        .tag-func {
            background: #a7f3d0;
            color: #065f46;
        }

        .footer {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 28px;
        }
        .total-progress-wrap {
            margin-bottom: 16px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #2563eb;
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #475569;
            margin-top: 4px;
        }
        .stats-row .done-count {
            color: #2563eb;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧩 东东 · 数学工具箱</h1>
        <div class="sub">📖 点击章节展开模块 · 进度自动保存</div>

        <div class="total-progress-wrap">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
            </div>
            <div class="stats-row">
                <span>📊 已完成：<span class="done-count" id="doneCount">0</span> / <span id="totalCount">0</span></span>
                <span id="celebration" style="display:none;">🎉 全部通关！</span>
            </div>
        </div>

        <div id="chaptersContainer"></div>

        <div class="footer">💪 每天进步一点点 · 东东专属</div>
    </div>

    <script>
        // ================================================================
        // 模块数据（含第三章 · 函数专题）
        // ================================================================
        const chapters = [{
            id: 'ch1',
            icon: '📚',
            iconClass: 'ch1-icon',
            title: '第一章 · 集合与常用逻辑用语',
            modules: [
                { id: '01_symbol_translate', title: '🔤 符号翻译训练场', desc: '∈、∉、⊆、⊂、∩、∪、∁ 翻译训练',
                tag: '核心', tagClass: 'tag-core' },
                { id: '02_number_sets', title: '🔢 数集与元素 · 真题实战', desc: '广东期中/期末/高考真题 · 含错题集',
                    tag: '真题', tagClass: 'tag-exam' },
                { id: '03_set_relations', title: '📐 集合关系 · 真题实战', desc: '子集、真子集、空集、子集个数 · 含错题集',
                    tag: '真题', tagClass: 'tag-exam' },
                { id: '04_set_operations', title: '🧮 集合运算 · 真题实战', desc: '交集、并集、补集 · 含错题集', tag: '真题',
                    tagClass: 'tag-exam' },
                { id: '05_logic_quantifiers', title: '🔁 逻辑量词与条件 · 真题实战', desc: '充分/必要、∀/∃、命题否定 · 含错题集',
                    tag: '真题', tagClass: 'tag-exam' },
                { id: '06_middle_tools', title: '🛠️ 初中工具补漏', desc: '因式分解 · 韦达定理 · 端点判断', tag: '工具',
                    tagClass: 'tag-tool' },
                { id: '07_param_subset', title: '⭐ 含参子集 · 压轴实战', desc: '分类讨论 · 空集陷阱 · 区间端点 · 含错题集',
                    tag: '压轴', tagClass: 'tag-hard' },
            ]
        }, {
            id: 'ch2',
            icon: '📖',
            iconClass: 'ch2-icon',
            title: '第二章 · 一元二次函数、方程和不等式',
            modules: [
                { id: '08_equality_property', title: '⚖️ 等式与不等式的性质', desc: '性质·作差法·倒数·秒答+基础强化+真题',
                    tag: '基础', tagClass: 'tag-basic' },
                { id: '09_basic_inequality_1', title: '📏 基本不等式（上）· 公式与应用', desc: '积定和最小·和定积最大·对勾函数',
                    tag: '核心', tagClass: 'tag-core' },
                { id: '10_basic_inequality_2', title: '🧩 基本不等式（下）· 配凑与拓展', desc: '配凑·"1"的代换·不等式链·建模',
                    tag: '进阶', tagClass: 'tag-advance' },
                { id: '11_quadratic_equation', title: '📈 二次函数与方程', desc: '系数识别·判别式·韦达定理·三种形式',
                    tag: '核心', tagClass: 'tag-core' },
                { id: '12_quadratic_inequality', title: '🎯 一元二次不等式', desc: '解法流程·开口陷阱·恒成立·含参讨论',
                    tag: '核心', tagClass: 'tag-core' },
            ]
        }, {
            id: 'ch3',
            icon: '📐',
            iconClass: 'ch3-icon',
            title: '第三章 · 函数的概念与性质',
            modules: [{
                id: '13_function_domain',
                title: '🎯 定义域 · 10题闯关',
                desc: '具体函数 · 抽象函数 · 括号范围不变',
                tag: '函数',
                tagClass: 'tag-func'
            }, {
                id: '14_function_expression',
                title: '🔧 解析式求法 · 10题闯关',
                desc: '换元法 · 待定系数法 · 方程组法',
                tag: '函数',
                tagClass: 'tag-func'
            }, {
                id: '15_function_range',
                title: '📊 值域 · 10题闯关',
                desc: '配方法 · 换元法 · 判别式法 · 分离常数法',
                tag: '函数',
                tagClass: 'tag-func'
            }, {
                id: '16_function_monotonicity',
                title: '📈 单调性 · 10题闯关',
                desc: '定义法 · 复合函数同增异减 · 对勾函数',
                tag: '函数',
                tagClass: 'tag-func'
            }, {
                id: '17_function_parity',
                title: '🔄 奇偶性 · 10题闯关',
                desc: '奇函数 · 偶函数 · 图像对称性',
                tag: '函数',
                tagClass: 'tag-func'
            }, {
                id: '18_function_symmetry',
                title: '🔁 对称与周期 · 10题闯关',
                desc: '对称轴 · 对称中心 · 周期',
                tag: '函数',
                tagClass: 'tag-func'
            }]
        }];

        // 所有模块的扁平列表（用于进度计算）
        const allModules = [];
        chapters.forEach(ch => {
            ch.modules.forEach(m => {
                allModules.push(m.id);
            });
        });

        // ================================================================
        // 进度管理
        // ================================================================
        function getCompleted() {
            try {
                return JSON.parse(localStorage.getItem('dongdong_modules') || '[]');
            } catch { return []; }
        }

        function saveCompleted(arr) {
            localStorage.setItem('dongdong_modules', JSON.stringify(arr));
        }

        // ================================================================
        // 渲染
        // ================================================================
        function render() {
            const completed = getCompleted();
            const container = document.getElementById('chaptersContainer');
            container.innerHTML = '';

            let totalDone = 0;

            chapters.forEach(ch => {
                let chDone = 0;
                ch.modules.forEach(m => {
                    if (completed.includes(m.id)) chDone++;
                });
                totalDone += chDone;

                const section = document.createElement('div');
                section.className = 'chapter-section';

                const header = document.createElement('div');
                header.className = 'chapter-header';
                header.innerHTML = `
                        <div class="chapter-left">
                            <div class="chapter-icon ${ch.iconClass}">${ch.icon}</div>
                            <div class="chapter-info">
                                <div class="chapter-title">${ch.title}</div>
                                <div class="chapter-progress">✅ ${chDone} / ${ch.modules.length} 模块完成</div>
                            </div>
                        </div>
                        <span class="chapter-arrow" id="arrow_${ch.id}">▶</span>
                    `;

                const list = document.createElement('div');
                list.className = 'module-list';
                list.id = 'list_' + ch.id;

                const grid = document.createElement('div');
                grid.className = 'module-grid';

                ch.modules.forEach(m => {
                    const isDone = completed.includes(m.id);
                    const card = document.createElement('a');
                    card.className = 'module-card';
                    // 所有模块的HTML文件放在 modules/ 文件夹下
                    card.href = `modules/${m.id}.html`;

                    const tagClass = isDone ? 'done' : (m.tagClass || '');
                    const tagText = isDone ? '✅ 已完成' : m.tag;

                    card.innerHTML = `
                            <div class="module-info">
                                <div class="module-title">${m.title}</div>
                                <div class="module-desc">${m.desc}</div>
                            </div>
                            <span class="module-tag ${tagClass}">${tagText}</span>
                        `;
                    grid.appendChild(card);
                });

                list.appendChild(grid);
                section.appendChild(header);
                section.appendChild(list);
                container.appendChild(section);

                header.addEventListener('click', () => {
                    const arrow = document.getElementById('arrow_' + ch.id);
                    const isOpen = list.classList.contains('open');
                    if (isOpen) {
                        list.classList.remove('open');
                        arrow.classList.remove('open');
                    } else {
                        list.classList.add('open');
                        arrow.classList.add('open');
                    }
                });

                // 默认第一章展开，其余收起
                if (ch.id === 'ch1') {
                    list.classList.add('open');
                    document.getElementById('arrow_' + ch.id).classList.add('open');
                }
            });

            // 更新总进度
            const total = allModules.length;
            document.getElementById('doneCount').textContent = totalDone;
            document.getElementById('totalCount').textContent = total;
            document.getElementById('progressFill').style.width = `${(totalDone/total)*100}%`;

            const celebration = document.getElementById('celebration');
            if (totalDone === total) {
                celebration.style.display = 'inline';
                celebration.textContent = '🎉 全部通关！东东太棒了！';
            } else {
                celebration.style.display = 'none';
            }
        }

        // ================================================================
        // 跨页面通信：当从模块页面返回时，自动更新进度
        // ================================================================
        window.addEventListener('storage', render);
        window.addEventListener('load', render);

        // 页面可见性变化时刷新（从模块页返回时触发）
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                render();
            }
        });
    </script>
</body>
</html>
