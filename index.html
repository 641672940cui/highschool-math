<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>东东 · 数学工具箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f6f8fa;
            padding: 20px 16px 40px;
            color: #0b1a2f;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .sub {
            font-size: 14px;
            color: #3b4a5e;
            margin-bottom: 20px;
            padding-left: 12px;
            border-left: 4px solid #2563eb;
            background: #eef2ff;
            border-radius: 0 12px 12px 0;
            padding: 6px 12px;
        }
        .module-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .module-card {
            background: #fff;
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid #e6edf4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: #0b1a2f;
            transition: 0.15s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .module-card:active {
            background: #f1f5f9;
            transform: scale(0.98);
        }
        .module-card.disabled {
            opacity: 0.6;
            cursor: default;
            pointer-events: none;
        }
        .module-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .module-title {
            font-weight: 600;
            font-size: 16px;
        }
        .module-desc {
            font-size: 13px;
            color: #64748b;
        }
        .module-tag {
            font-size: 12px;
            background: #dbeafe;
            color: #1e4f8a;
            padding: 2px 12px;
            border-radius: 30px;
            font-weight: 500;
            white-space: nowrap;
        }
        .module-tag.done {
            background: #bbf7d0;
            color: #065f46;
        }
        .module-tag.tag-core {
            background: #dbeafe;
            color: #1e4f8a;
        }
        .module-tag.tag-exam {
            background: #fef3c7;
            color: #92400e;
        }
        .module-tag.tag-tool {
            background: #e0e7ff;
            color: #3730a3;
        }
        .module-tag.tag-hard {
            background: #fce4ec;
            color: #b91c1c;
        }
        .footer {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            margin-top: 28px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            margin-top: 16px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #2563eb;
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #475569;
            margin-top: 4px;
        }
        .stats-row .done-count {
            color: #2563eb;
            font-weight: 600;
        }
        .stats-row .total-count {
            color: #64748b;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🧩 东东 · 数学工具箱</h1>
    <div class="sub">📖 点击模块开始训练 · 进度自动保存</div>

    <!-- 进度条 -->
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
    </div>
    <div class="stats-row">
        <span>📊 已完成：<span class="done-count" id="doneCount">0</span> / <span class="total-count" id="totalCount">0</span></span>
        <span id="celebration" style="display:none;">🎉 全部通关！</span>
    </div>

    <div class="module-grid" id="moduleGrid" style="margin-top:16px;"></div>

    <div class="footer">💪 每天进步一点点 · 东东专属</div>
</div>

<script>
    // ================================================================
    // 模块配置
    // ================================================================
    const modules = [
        { id: '01_symbol_translate', title: '🔤 符号翻译训练场', desc: '∈、∉、⊆、⊂、∩、∪、∁ 翻译训练', tag: '核心', tagClass: 'tag-core' },
        { id: '02_number_sets',      title: '🔢 数集与元素 · 真题实战', desc: '广东期中/期末/高考真题 · 含错题集', tag: '真题', tagClass: 'tag-exam' },
        { id: '03_set_relations',    title: '📐 集合关系 · 真题实战', desc: '子集、真子集、空集、子集个数 · 含错题集', tag: '真题', tagClass: 'tag-exam' },
        { id: '04_set_operations',   title: '🧮 集合运算 · 真题实战', desc: '交集、并集、补集 · 含错题集（待上线）', tag: '真题', tagClass: 'tag-exam' },
        { id: '05_logic_quantifiers',title: '🔁 充分条件与量词 · 真题实战', desc: '充分/必要、∀/∃、命题否定（待上线）', tag: '真题', tagClass: 'tag-exam' },
        { id: '06_middle_tools',     title: '🛠️ 初中工具补漏', desc: '因式分解 · 韦达定理 · 端点判断', tag: '工具', tagClass: 'tag-tool' },
        { id: '07_param_subset',     title: '⭐ 含参子集压轴', desc: '含参子集难题的完整拆解（待上线）', tag: '压轴', tagClass: 'tag-hard' },
    ];

    // ================================================================
    // 进度管理
    // ================================================================
    function getCompleted() {
        try {
            return JSON.parse(localStorage.getItem('dongdong_modules') || '[]');
        } catch { return []; }
    }

    function saveCompleted(list) {
        localStorage.setItem('dongdong_modules', JSON.stringify(list));
    }

    // ================================================================
    // 渲染
    // ================================================================
    function render() {
        const completed = getCompleted();
        const grid = document.getElementById('moduleGrid');
        grid.innerHTML = '';

        let doneCount = 0;

        // 已上线的模块 ID 列表（可点击）
        const availableModules = ['01_symbol_translate', '02_number_sets', '03_set_relations', '06_middle_tools'];

        modules.forEach(m => {
            const isDone = completed.includes(m.id);
            if (isDone) doneCount++;

            const card = document.createElement('a');
            card.className = 'module-card';

            // 检查是否已上线
            const isAvailable = availableModules.includes(m.id);
            if (!isAvailable) {
                card.classList.add('disabled');
                card.href = '#';
            } else {
                card.href = `modules/${m.id}.html`;
            }

            const tagClass = isDone ? 'done' : (m.tagClass || '');
            const tagText = isDone ? '✅ 已完成' : m.tag;

            card.innerHTML = `
                <div class="module-info">
                    <div class="module-title">${m.title}</div>
                    <div class="module-desc">${m.desc}</div>
                </div>
                <span class="module-tag ${tagClass}">${tagText}</span>
            `;
            grid.appendChild(card);
        });

        // 更新进度
        const total = modules.length;
        document.getElementById('doneCount').textContent = doneCount;
        document.getElementById('totalCount').textContent = total;
        document.getElementById('progressFill').style.width = `${(doneCount/total)*100}%`;

        // 全部完成彩蛋
        const celebration = document.getElementById('celebration');
        if (doneCount === total) {
            celebration.style.display = 'inline';
            celebration.textContent = '🎉 全部通关！东东太棒了！';
        } else {
            celebration.style.display = 'none';
        }
    }

    // ================================================================
    // 监听存储变化
    // ================================================================
    window.addEventListener('storage', render);
    window.addEventListener('load', render);
</script>
</body>
</html>
