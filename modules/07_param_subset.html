<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>解题思维导航 · 条件→方法直觉训练</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
    </script>
    <style>
        :root {
            --bg: #fdfcf8;
            --text: #3d3228;
            --gold: #d4923a;
            --green: #4a9e6b;
            --red: #d46868;
            --blue: #5a8ec0;
            --purple: #8e7cc3;
            --teal: #4a9e9e;
            --pink: #c08090;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
            background: #f7f4ed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 8px;
            color: var(--text);
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: rgba(255,254,250,0.96);
            border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(80,50,20,0.1);
            padding: 16px 12px 20px;
            border: 1px solid rgba(190,160,120,0.3);
            margin: 4px 0 24px 0;
        }
        .header { text-align: center; margin-bottom: 8px; }
        .header .emoji { font-size: 1.5rem; display: block; }
        .header h1 { font-size: 1.2rem; font-weight: 700; color: #4a3020; }
        .header .subtitle { font-size: 0.7rem; color: #9a8878; }
        .header .msg { font-size: 0.68rem; color: #c08040; font-weight: 600; background: #fef8ef;
            display: inline-block; padding: 2px 10px; border-radius: 12px; margin-top: 2px; }

        .tab-row { display: flex; gap: 2px; margin-bottom: 6px; background: #fdf9f1; padding: 2px;
            border-radius: 22px; flex-wrap: wrap; }
        .tab-btn { flex: 1 1 auto; min-width: 36px; background: transparent; border: none; color: #8a7860;
            font-weight: 600; padding: 6px 1px; border-radius: 18px; cursor: pointer; font-size: 0.55rem;
            transition: 0.2s; white-space: nowrap; -webkit-tap-highlight-color: transparent; line-height: 1.2; }
        .tab-btn.active { background: #d4923a; color: #fff; box-shadow: 0 3px 10px rgba(200,130,40,0.3); }

        .info-row { display: flex; justify-content: space-between; align-items: center; margin: 3px 0 5px;
            font-size: 0.68rem; color: #8a7860; flex-wrap: wrap; gap: 3px; }
        .score { font-weight: 700; color: #5c3d2e; }
        .count { font-weight: 500; }

        .card-grid { display: flex; flex-direction: column; gap: 9px; margin: 6px 0 8px;
            max-height: 52vh; overflow-y: auto; padding-right: 2px; -webkit-overflow-scrolling: touch; }
        .card-grid::-webkit-scrollbar { width: 3px; }
        .card-grid::-webkit-scrollbar-thumb { background: #d8c8b0; border-radius: 4px; }

        .quiz-card { background: #fff; border-radius: 13px; padding: 13px 13px 11px;
            border: 1px solid #e8e0d3; box-shadow: 0 4px 10px rgba(80,50,20,0.03);
            -webkit-tap-highlight-color: transparent; user-select: none; position: relative; transition: 0.2s; }
        .quiz-card.correct { border-color: #8cc89a; background: #f8fdf9; }
        .quiz-card.wrong { border-color: #e89898; background: #fdf8f7; }

        .card-tag { display: inline-block; font-size: 0.58rem; font-weight: 700; padding: 2px 7px;
            border-radius: 9px; margin-bottom: 5px; letter-spacing: 0.2px; }
        .card-tag.s1 { background: #eef6fd; color: #4a7eb0; }
        .card-tag.s2 { background: #fef7ec; color: #c08030; }
        .card-tag.s3 { background: #e8f8f8; color: #3a7a7a; }
        .card-tag.s4 { background: #f0fdf0; color: #3a7a50; }
        .card-tag.s5 { background: #f0f0fa; color: #6e5ea0; }
        .card-tag.s6 { background: #faf0f4; color: #9a6070; }

        .card-q { font-weight: 600; font-size: 0.86rem; color: #4a3f35; line-height: 1.6; margin-bottom: 3px;
            word-break: break-word; }

        .options { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; width: 100%; }
        .opt-btn { display: block; width: 100%; background: #faf7f0; border: 1.5px solid #e0d5c0; color: #5c4a36;
            padding: 8px 11px; border-radius: 11px; font-weight: 600; font-size: 0.76rem; cursor: pointer;
            transition: 0.15s; -webkit-tap-highlight-color: transparent; line-height: 1.5;
            text-align: left; word-break: break-word; }
        .opt-btn.correct-answer { background: #7cc090; border-color: #5a9e6b; color: #fff; }
        .opt-btn.wrong-answer { background: #e89090; border-color: #d46868; color: #fff; }

        .fb { display: none; margin-top: 7px; padding: 6px 9px; border-radius: 7px;
            font-weight: 600; font-size: 0.72rem; line-height: 1.5; }
        .quiz-card.answered .fb { display: block; }
        .fb.ok { background: #eaf8ee; color: #3a7a50; }
        .fb.no { background: #fdf0f0; color: #b04040; }
        .fb .fb-method { font-weight: 400; font-size: 0.7rem; color: #555; margin-top: 2px; display: block; }
        .fb .fb-intent { font-weight: 400; font-size: 0.68rem; color: #8a6a40; margin-top: 3px; display: block;
            background: rgba(200,150,50,0.05); padding: 3px 6px; border-radius: 5px;
            border-left: 2px solid #d4923a; }

        .nav-row { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
        button { background: #fff; border: 1px solid #d8c8b0; color: #5c3d2e; font-weight: 600;
            padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 0.72rem;
            transition: 0.2s; -webkit-tap-highlight-color: transparent; }
        button.primary { background: #d4923a; border-color: #c8822a; color: #fff; }
        button.wrongbook { background: #fdf0f0; border-color: #e0b8b8; color: #b04040; }
        button:active { transform: scale(0.96); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: #fff; border-radius: 1.1rem; padding: 16px 12px; width: 92%;
            max-width: 480px; max-height: 65vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .modal h2 { font-size: 1rem; color: #4a3020; margin-bottom: 8px; text-align: center; }
        .modal .wrong-item { background: #fdf8f7; border: 1px solid #f0d0d0; border-radius: 9px;
            padding: 8px 10px; margin-bottom: 7px; font-size: 0.74rem; line-height: 1.5; }
        .modal .wrong-item .wq { font-weight: 600; color: #4a3f35; }
        .modal .wrong-item .wa { color: #4a9e6b; margin-top: 2px; }
        .modal .wrong-item .wt { color: #888; font-size: 0.66rem; margin-top: 2px; }
        .modal .empty { text-align: center; color: #999; padding: 20px; font-size: 0.8rem; }
        .modal .close-btn { display: block; margin: 8px auto 0; background: #d4923a; color: #fff;
            border: none; padding: 9px 24px; border-radius: 18px; font-weight: 700; font-size: 0.8rem;
            cursor: pointer; }

        @media (max-width: 500px) {
            .container { padding: 12px 7px 16px; border-radius: 1.3rem; }
            .tab-btn { font-size: 0.5rem; padding: 5px 1px; min-width: 30px; }
            .card-q { font-size: 0.8rem; }
            .opt-btn { font-size: 0.72rem; padding: 7px 9px; }
            .card-grid { max-height: 55vh; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="emoji">🧭</span>
            <h1>解题思维导航 · 条件反射训练</h1>
            <div class="subtitle">真实题目 · 选方法不计算 · 每道题揭示出题者意图</div>
            <div class="msg">六大模块 90题 · 看到条件就知道用什么方法</div>
        </div>

        <div class="tab-row" id="tabRow">
            <button class="tab-btn active" data-module="s1">一元二次<br><small>15题</small></button>
            <button class="tab-btn" data-module="s2">完全平方<br><small>15题</small></button>
            <button class="tab-btn" data-module="s3">分式结构<br><small>15题</small></button>
            <button class="tab-btn" data-module="s4">倒数结构<br><small>15题</small></button>
            <button class="tab-btn" data-module="s5">相等关系<br><small>15题</small></button>
            <button class="tab-btn" data-module="s6">综合识别<br><small>15题</small></button>
        </div>

        <div class="info-row">
            <span class="count" id="countInfo"></span>
            <span class="score" id="scoreBoard">得分：0 / 0</span>
        </div>
        <div id="cardGrid" class="card-grid"></div>

        <div class="nav-row">
            <button id="refreshBtn">换一批</button>
            <button id="resetBtn" class="primary">重新开始</button>
            <button id="wrongBookBtn" class="wrongbook">📋 错题集</button>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>📋 错题集</h2>
            <div id="wrongList"></div>
            <button class="close-btn" id="closeModal">关闭</button>
        </div>
    </div>

    <script>
    (function() {
        function init() {
            var bank = {
                // ==================== 模块1：一元二次（韦达/求根/判别式/不等式）15题 ====================
                s1: [
                    { id:'s1a', type:'choice', tag:'一元二次',
                        q:'\\(x^2-5x+6=0\\)，求\\(x_1^2+x_2^2\\)。最快的方法是？',
                        opts:['求根公式（先求根再代入）','韦达定理（用\\(x_1+x_2=5, x_1x_2=6\\)）','判别式','配方法'],
                        ans:1,
                        tip:'x₁²+x₂²=(x₁+x₂)²-2x₁x₂=25-12=13。不需要求根！',
                        intent:'出题者问"x₁²+x₂²"而不是"x₁和x₂是多少"→暗示你用韦达定理' },
                    { id:'s1b', type:'choice', tag:'一元二次',
                        q:'\\(x^2-4x+3>0\\) 的解集是？选择最快的解法。',
                        opts:['求根公式','因式分解\\((x-1)(x-3)>0\\)','韦达定理','判别式'],
                        ans:1,
                        tip:'能分解时优先分解→(x-1)(x-3)>0→画数轴→x<1或x>3',
                        intent:'二次不等式→能因式分解就先分解，比求根公式快得多' },
                    { id:'s1c', type:'choice', tag:'一元二次',
                        q:'\\(x^2-2x+3>0\\) 恒成立吗？用什么判断最快？',
                        opts:['求根公式','判别式Δ','韦达定理','代入x=0'],
                        ans:1,
                        tip:'Δ=(-2)²-4×1×3=4-12=-8<0，且a=1>0→恒大于0',
                        intent:'"恒成立"三个字→判别式的专属信号。配方也能做但判别式更快' },
                    { id:'s1d', type:'choice', tag:'一元二次',
                        q:'已知\\(x_1+x_2=4, x_1x_2=1\\)，以\\(x_1,x_2\\)为根的方程是？',
                        opts:['\\(x^2-4x+1=0\\)','\\(x^2+4x+1=0\\)','\\(x^2-4x-1=0\\)','\\(x^2+4x-1=0\\)'],
                        ans:0,
                        tip:'韦达逆用：x²-(和)x+积=0→x²-4x+1=0',
                        intent:'给和与积→构造方程。考的是韦达定理的"逆用"' },
                    { id:'s1e', type:'choice', tag:'一元二次',
                        q:'\\(x^2-4x+3=0\\) 求两根。因式分解和求根公式，选哪个？',
                        opts:['因式分解\\((x-1)(x-3)=0\\)','求根公式','都一样','看心情'],
                        ans:0,
                        tip:'一眼看出(x-1)(x-3)=0，根为1和3。求根公式也能做但慢',
                        intent:'能分解时不用求根公式→出题者想看你是否有"先试分解"的意识' },
                    { id:'s1f', type:'choice', tag:'一元二次',
                        q:'\\(x^2-6x+9\\le 0\\) 的解集是？',
                        opts:['\\(x\\le 3\\)','\\(x=3\\)','无解','\\(x\\ge 3\\)'],
                        ans:1,
                        tip:'x²-6x+9=(x-3)²≤0，平方≥0故只能=0→x=3',
                        intent:'完全平方式伪装成不等式→识别结构比套公式重要' },
                    { id:'s1g', type:'choice', tag:'一元二次',
                        q:'\\(y=x^2-4x+3\\) 与x轴有几个交点？',
                        opts:['0个','1个','2个','3个'],
                        ans:2,
                        tip:'方法一：Δ=16-12=4>0→两个。方法二：(x-1)(x-3)=0→两个',
                        intent:'一题多解→判别式和因式分解互相验证' },
                    { id:'s1h', type:'choice', tag:'一元二次',
                        q:'\\(2x^2+7x-4=0\\) 求根。十字相乘和求根公式，哪个更快？',
                        opts:['求根公式','十字相乘\\((2x-1)(x+4)=0\\)','都一样','配方法'],
                        ans:1,
                        tip:'2×(-4)=-8，找两数乘得-8加得7→8和-1→分解成功',
                        intent:'二次系数≠1也能十字相乘→出题者想打破你的思维定式' },
                    { id:'s1i', type:'choice', tag:'一元二次',
                        q:'\\(y=x^2-4x+3\\) 与 \\(y=2x-1\\) 有几个交点？第一步？',
                        opts:['画图','联立\\(x^2-4x+3=2x-1\\)→整理成二次方程','配方','求导'],
                        ans:1,
                        tip:'联立得x²-6x+4=0→Δ=36-16=20>0→两个交点',
                        intent:'"交点"问题→联立方程→二次方程→判别式。这是固定流程' },
                    { id:'s1j', type:'choice', tag:'一元二次',
                        q:'\\(x^2-3x+2=0\\) 和 \\(x^2-3x-2=0\\)，哪个能用十字相乘？',
                        opts:['前者（得1和2）','后者（得？）','都能','都不能'],
                        ans:0,
                        tip:'前者(x-1)(x-2)=0。后者不能分解→需用求根公式',
                        intent:'不是所有二次方程都能分解→先判断，不能分解就用求根公式' },
                    { id:'s1k', type:'choice', tag:'一元二次',
                        q:'\\(y=x^2+2x+5\\) 与x轴相交吗？用什么判断？',
                        opts:['配方','判别式Δ=4-20=-16<0→不相交','求根','画图'],
                        ans:1,
                        tip:'Δ<0→无交点。只需判断Δ符号，不需要配方或求根',
                        intent:'"与x轴是否相交"→判别式就够了，不需要多余步骤' },
                    { id:'s1l', type:'choice', tag:'一元二次',
                        q:'\\(x^2-2x-8=0\\) 求\\(|x_1-x_2|\\)。最快的方法？',
                        opts:['求根再相减','韦达定理：\\(|x_1-x_2|=\\sqrt{(x_1+x_2)^2-4x_1x_2}\\)','判别式','猜'],
                        ans:1,
                        tip:'x₁+x₂=2，x₁x₂=-8→|x₁-x₂|=√(4+32)=6。不求根！',
                        intent:'求两根之差的绝对值→韦达定理套公式。出题者不想让你求根' },
                    { id:'s1m', type:'choice', tag:'一元二次',
                        q:'\\(x^2-5x+6>0\\) 和 \\(x^2-5x+6<0\\)，解集的关系是？',
                        opts:['互补（大于取两边，小于取中间）','相同','互为相反数','无关'],
                        ans:0,
                        tip:'>0→x<2或x>3；<0→2<x<3。两者互补',
                        intent:'大于取两边，小于取中间→开口向上的通用规律' },
                    { id:'s1n', type:'choice', tag:'一元二次',
                        q:'\\(x^2+4x+5=0\\) 有几个实根？',
                        opts:['0个（Δ<0）','1个','2个','无法判断'],
                        ans:0,
                        tip:'Δ=16-20=-4<0→无实根',
                        intent:'Δ<0→无实根。注意：有复数根但初中不要求' },
                    { id:'s1o', type:'choice', tag:'一元二次',
                        q:'\\(x^2-2(m+1)x+m^2=0\\) 有实根，求m范围。用什么？',
                        opts:['韦达定理','判别式Δ≥0','配方','求根公式'],
                        ans:1,
                        tip:'有实根→Δ≥0→解关于m的不等式',
                        intent:'含参方程有实根→判别式≥0。这是含参问题的标准入口' },
                ],

                // ==================== 模块2：完全平方（配方/完全平方识别）15题 ====================
                s2: [
                    { id:'s2a', type:'choice', tag:'完全平方',
                        q:'\\(x^2+6x+11\\) 的最小值是多少？用什么方法？',
                        opts:['基本不等式','配方：\\((x+3)^2+2\\ge 2\\)','韦达定理','判别式'],
                        ans:1,
                        tip:'x²+6x+9+2=(x+3)²+2≥2，当x=-3时取等',
                        intent:'二次三项式求最值→配方。这是配方的标准应用场景' },
                    { id:'s2b', type:'choice', tag:'完全平方',
                        q:'\\(\\sqrt{7+2\\sqrt{10}}\\) 化简。用什么方法？',
                        opts:['计算器','凑完全平方\\((\\sqrt{5}+\\sqrt{2})^2\\)','平方差','换元'],
                        ans:1,
                        tip:'7+2√10=(√5)²+2·√5·√2+(√2)²=(√5+√2)²→原式=√5+√2',
                        intent:'2√10=2·√5·√2→这是完全平方的"指纹"，识别它就解出来了' },
                    { id:'s2c', type:'choice', tag:'完全平方',
                        q:'\\(-x^2+6x-5\\) 配方后的形式是？',
                        opts:['\\((x-3)^2+4\\)','\\(-(x-3)^2+4\\)','\\((x+3)^2-4\\)','\\(-(x+3)^2-4\\)'],
                        ans:1,
                        tip:'先提负号：-(x²-6x)-5=-((x-3)²-9)-5=-(x-3)²+4',
                        intent:'a<0时先提负号→这是配方最容易出错的细节' },
                    { id:'s2d', type:'choice', tag:'完全平方',
                        q:'\\(2x^2-8x+5\\) 配方后的最小值是？',
                        opts:['-3','-1','1','3'],
                        ans:0,
                        tip:'2(x²-4x)+5=2(x-2)²-8+5=2(x-2)²-3≥-3',
                        intent:'含系数配方：先提系数→括号内配方→展开修正' },
                    { id:'s2e', type:'choice', tag:'完全平方',
                        q:'\\(x^2+2x+3>0\\) 和 \\(x^2+2x-3>0\\)，判断方法一样吗？',
                        opts:['一样','前者配方更快\\((x+1)^2+2>0\\)','后者配方更快','都用判别式'],
                        ans:1,
                        tip:'前者配方一眼看出恒成立。后者需因式分解或判别式',
                        intent:'两个相似的式子，最优方法可能不同→识别细微差别' },
                    { id:'s2f', type:'choice', tag:'完全平方',
                        q:'\\(3x^2+12x+10\\) 配方第一步？',
                        opts:['配平方','提系数3→\\(3(x^2+4x)+10\\)','修正常数','直接写答案'],
                        ans:1,
                        tip:'提系数→配平方→修正：3(x+2)²-12+10=3(x+2)²-2',
                        intent:'配方的标准流程：提系数→配平方→修正常数' },
                    { id:'s2g', type:'choice', tag:'完全平方',
                        q:'\\(x^2+\\frac{1}{x^2}\\) 的最小值？用什么方法？',
                        opts:['配方\\((x+1/x)^2-2\\)','基本不等式（积为定值）','两者都可以','无法求'],
                        ans:2,
                        tip:'配方得(x+1/x)²-2≥2-2=0？不对！x+1/x≥2→(x+1/x)²≥4→原式≥2',
                        intent:'此题基本不等式更直接。但配方能帮你理解"为什么是2"' },
                    { id:'s2h', type:'choice', tag:'完全平方',
                        q:'\\(x^2-4x+7\\) 在 \\(x\\in[0,3]\\) 上的最小值？配方后还要做什么？',
                        opts:['配方就够了','检查顶点x=2是否在[0,3]内（在→最小值3）','求端点值','判别式'],
                        ans:1,
                        tip:'配方得(x-2)²+3，顶点(2,3)。x=2在区间内→最小值3',
                        intent:'配方得顶点→还要判断顶点是否在区间内→考的是"配方+判断"' },
                    { id:'s2i', type:'choice', tag:'完全平方',
                        q:'\\(x^2-6x+9\\) 和 \\(x^2-6x+10\\)，哪个是完全平方？',
                        opts:['前者\\((x-3)^2\\)','后者\\((x-3)^2+1\\)','都是','都不是'],
                        ans:0,
                        tip:'前者恰好=(x-3)²。后者=(x-3)²+1，不是恰好',
                        intent:'完全平方和配方的区别：恰好→完全平方；差常数→配方' },

                        q:'什么时候用换元法？',
                        opts:['任何情况','同一个复杂结构出现两次以上时','变量太多时','求最值时'],
                        ans:1,
                        tip:'如x+1/x反复出现→令t=x+1/x→x²+1/x²=t²-2',
                        intent:'重复出现=换元的强烈信号' },
                    { id:'s5k', type:'choice', tag:'相等关系',
                        q:'\\(x+\\frac{1}{x}\\)和\\(x^2+\\frac{1}{x^2}\\)同时出现，该怎么做？',
                        opts:['分别处理','令t=x+1/x→统一用t表达','基本不等式','消元'],
                        ans:1,
                        tip:'令t=x+1/x→x²+1/x²=t²-2→原式变成t的表达式',
                        intent:'同一结构的不同次幂同时出现→换元的经典场景' },
                    { id:'s5l', type:'choice', tag:'相等关系',
                        q:'\\(a+b=2\\)，求\\(\\frac{1}{a}+\\frac{4}{b}\\)的最小值。选什么方法？',
                        opts:['消元','"1的代换"乘\\((a+b)/2\\)','直接基本不等式','柯西不等式'],
                        ans:1,
                        tip:'(a+b)/2·(1/a+4/b)展开→匹配系数',
                        intent:'条件和分母完美匹配→"1的代换"是最佳选择' },
                    { id:'s5m', type:'choice', tag:'相等关系',
                        q:'\\(a+b=2\\)，求\\(\\frac{1}{a}+\\frac{1}{b}\\)的最小值。结果是？',
                        opts:['1','2','3','4'],
                        ans:1,
                        tip:'(a+b)(1/a+1/b)=2+a/b+b/a≥2+2=4→再除以2→≥2',
                        intent:'注意：乘的是(a+b)/2=1，展开后要记得除以2' },
                    { id:'s5n', type:'choice', tag:'相等关系',
                        q:'\\(x+2y=1\\)，求\\(\\frac{1}{x}+\\frac{1}{y}\\)的最小值。第一步？',
                        opts:['消元','"1的代换"乘\\((x+2y)\\)','直接基本不等式','换元'],
                        ans:1,
                        tip:'(x+2y)(1/x+1/y)=1+2y/x+x/y+2=3+(2y/x+x/y)≥3+2√2',
                        intent:'条件和分母系数不完全匹配→乘上后展开会出现对勾结构' },
                    { id:'s5o', type:'choice', tag:'相等关系',
                        q:'"1的代换"的本质是什么？',
                        opts:['乘以1不改变值','用约束条件构造"1"','消去一个变量','换元法'],
                        ans:1,
                        tip:'如a+b=1→(a+b)就是1→乘上去展开改变结构但不改变值',
                        intent:'核心：用已知等式造一个"1"，乘上去不改变值但改变结构' },
                ],

                // ==================== 模块6：综合识别 15题 ====================
                s6: [
                    { id:'s6a', type:'choice', tag:'综合识别',
                        q:'一道题同时出现\\(x^2\\)和\\(\\frac{1}{x}\\)，应该往哪个方向想？',
                        opts:['配方','基本不等式（可能需要配凑）','韦达定理','判别式'],
                        ans:1,
                        tip:'x²和1/x→不是倒数对。但可以想办法配凑成能用基本不等式的结构',
                        intent:'同时出现二次和分式→想想能不能变成倒数对结构' },
                    { id:'s6b', type:'choice', tag:'综合识别',
                        q:'"a,b>0"+"求最小值"→最可能用什么？"二次函数"+"求最值"→最可能用什么？',
                        opts:['前者基本不等式，后者配方','都用基本不等式','都用配方','没有规律'],
                        ans:0,
                        tip:'正数+求最小值→基本不等式。二次函数+求最值→配方',
                        intent:'不同的条件组合→不同的方法映射。建立映射是训练目标' },
                    { id:'s6c', type:'choice', tag:'综合识别',
                        q:'\\(x_1+x_2=4, x_1x_2=1\\)，没给方程。怎么利用这些条件？',
                        opts:['无法处理','韦达逆用构造方程','基本不等式','配方'],
                        ans:1,
                        tip:'韦达逆用：以x₁,x₂为根的方程是x²-4x+1=0',
                        intent:'韦达定理可以正用和逆用→给和与积→逆用构造方程' },
                    { id:'s6d', type:'choice', tag:'综合识别',
                        q:'"求最大值"和"求最小值"，在基本不等式中方向不同。怎么选方向？',
                        opts:['没区别','和定→积最大；积定→和最小','最大用配方，最小用基本不等式','随便'],
                        ans:1,
                        tip:'条件给"和"→求积最大。条件给"积"→求和最小',
                        intent:'方向感：和定求积最大，积定求和最小。不能搞反' },
                    { id:'s6e', type:'choice', tag:'综合识别',
                        q:'遇到一道没思路的题，第一步该做什么？',
                        opts:['放弃','分析条件的结构特征','随便试一个方法','求导'],
                        ans:1,
                        tip:'扫条件→识别结构→根据结构选方法。没思路=没识别出结构',
                        intent:'解题不是瞎试→先看条件里有什么数学结构' },
                    { id:'s6f', type:'choice', tag:'综合识别',
                        q:'韦达定理和基本不等式能一起用吗？',
                        opts:['不能','能！韦达给出和与积→作为基本不等式的输入','只能选一个','互斥'],
                        ans:1,
                        tip:'如x₁+x₂=4→a²+b²≥(a+b)²/2→韦达提供"和"的数据',
                        intent:'方法可以组合→韦达提供数据，基本不等式处理数据' },
                    { id:'s6g', type:'choice', tag:'综合识别',
                        q:'判别式法和基本不等式法求最值，本质区别是什么？',
                        opts:['没区别','判别式→"有解性"角度；基本不等式→"放缩"角度','判别式更通用','基本不等式更通用'],
                        ans:1,
                        tip:'判别式：构造二次方程，用Δ≥0求范围。基本不等式：直接放缩表达式',
                        intent:'两种求最值思路→一个从方程出发，一个从不等式出发' },
                    { id:'s6h', type:'choice', tag:'综合识别',
                        q:'\\(\\frac{x^2+2x+2}{x+1}\\)（x>-1）求最小值。完整流程？',
                        opts:['直接基本不等式','分子配方→拆项→基本不等式→取等','求导','换元→基本不等式'],
                        ans:1,
                        tip:'分子=(x+1)²+1→原式=(x+1)+1/(x+1)≥2',
                        intent:'复杂题=多个简单步骤串联→每一步用一种方法' },
                    { id:'s6i', type:'choice', tag:'综合识别',
                        q:'一种方法走不通时，应该怎么办？',
                        opts:['放弃','回到条件重新识别结构，换方法','硬算','随便写'],
                        ans:1,
                        tip:'走不通→方法选择可能有误→重新分析条件',
                        intent:'解题不是线性的→方法A不行就回到条件换方法B' },
                    { id:'s6j', type:'choice', tag:'综合识别',
                        q:'以下哪个不是有效的"条件→方法"映射？',
                        opts:['和与积→基本不等式','x₁+x₂和x₁x₂→韦达定理','x²+bx+c→配方','题目很长→放弃'],
                        ans:3,
                        tip:'"题目很长"不是数学结构→不能作为选方法的依据',
                        intent:'有效映射的条件：必须是数学结构特征，不是表面特征' },
                    { id:'s6k', type:'choice', tag:'综合识别',
                        q:'同一道题能用两种方法解且结果一样，说明什么？',
                        opts:['方法选错了','两种方法等价，互相验证','题目太简单','我算错了'],
                        ans:1,
                        tip:'配方和基本不等式都能求x²+1/x²的最小值→殊途同归',
                        intent:'一题多解=加深理解→不同方法从不同角度解释同一个事实' },
                    { id:'s6l', type:'choice', tag:'综合识别',
                        q:'解题时应该先确定方法再动笔，还是边写边想？',
                        opts:['边写边想','先识别结构→确定方法→规划步骤→再动笔','都一样','看心情'],
                        ans:1,
                        tip:'高手解题：先想清楚用什么方法，再一步步写',
                        intent:'先想后做→避免写到一半发现方法不对' },
                    { id:'s6m', type:'choice', tag:'综合识别',
                        q:'学完这几个模块，看到新题的第一反应应该是什么？',
                        opts:['慌','条件属于哪个类型？→对应什么方法？','先求导再说','先猜答案'],
                        ans:1,
                        tip:'分类：条件→类型→方法。这就是"条件反射"',
                        intent:'训练目标：看到条件→自动分类→联想方法→变成本能' },
                    { id:'s6n', type:'choice', tag:'综合识别',
                        q:'\\(a+b=2\\)，求\\(a^2+b^2\\)最小值。消元法和基本不等式都能做，哪个揭示本质？',
                        opts:['消元法','基本不等式\\(a^2+b^2\\ge (a+b)^2/2\\)（揭示了平方和与和的平方的关系）','都一样','没法比较'],
                        ans:1,
                        tip:'基本不等式揭示结构关系：平方和≥和平方的一半',
                        intent:'好的方法不仅算出答案，还能揭示数学结构的内在联系' },
                    { id:'s6o', type:'choice', tag:'综合识别',
                        q:'为什么有的题一看就会，有的题完全没有思路？根本区别在哪？',
                        opts:['难度不同','有没有识别出条件中的数学结构','计算量大不大','数字大小'],
                        ans:1,
                        tip:'一看就会=条件结构熟悉→自动匹配方法。没思路=结构陌生',
                        intent:'训练的目标就是扩大"熟悉结构"的范围→减少"没思路"的情况' },
                ]
            };

            // ==================== 状态管理 ====================
            var currentModule = 's1';
            var totalCorrect = 0;
            var totalAnswered = 0;
            var wrongList = [];
            var tabBtns = document.querySelectorAll('.tab-btn');
            var cardGrid = document.getElementById('cardGrid');
            var scoreBoard = document.getElementById('scoreBoard');
            var countInfo = document.getElementById('countInfo');
            var modalOverlay = document.getElementById('modalOverlay');
            var wrongListDiv = document.getElementById('wrongList');

            function updateScore() {
                var pct = totalAnswered > 0 ? Math.round(totalCorrect / totalAnswered * 100) : 0;
                var emoji = pct >= 80 ? '厉害' : pct >= 60 ? '加油' : '';
                scoreBoard.textContent = '得分：' + totalCorrect + ' / ' + totalAnswered + ' (' + pct + '%) ' + emoji;
            }

            function getTagClassByModule(mod) {
                var map = { s1:'s1', s2:'s2', s3:'s3', s4:'s4', s5:'s5', s6:'s6' };
                return map[mod] || 's1';
            }

            function shuffle(arr) {
                var a = arr.slice();
                for (var i = a.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var t = a[i]; a[i] = a[j]; a[j] = t;
                }
                return a;
            }

            function getQuestions() {
                var all = bank[currentModule] || [];
                return shuffle(all).slice(0, 6);
            }

            function addToWrongList(q, userAnswer) {
                var exists = wrongList.some(function(item) { return item.id === q.id; });
                if (!exists) {
                    wrongList.push({
                        id: q.id, module: currentModule, tag: q.tag, q: q.q,
                        opts: q.opts, ans: q.ans, tip: q.tip, type: q.type, userAnswer: userAnswer
                    });
                }
            }

            function renderCards() {
                var qs = getQuestions();
                var total = (bank[currentModule] || []).length;
                countInfo.textContent = '本题库共' + total + '题，本次抽取6题';
                cardGrid.innerHTML = '';

                for (var idx = 0; idx < qs.length; idx++) {
                    var q = qs[idx];
                    var card = document.createElement('div');
                    card.className = 'quiz-card';
                    var tagClass = getTagClassByModule(currentModule);
                    var html = '<div class="card-tag ' + tagClass + '">' + q.tag + '</div>';
                    html += '<div class="card-q">' + q.q + '</div>';

                    if (q.type === 'choice') {
                        html += '<div class="options">';
                        var lb = ['A','B','C','D'];
                        for (var o = 0; o < q.opts.length; o++) {
                            html += '<span class="opt-btn" data-opt="' + o + '">' + lb[o] + '. ' + q.opts[o] + '</span>';
                        }
                        html += '</div>';
                    }
                    html += '<div class="fb"><span class="fb-text"></span><span class="fb-method"></span><span class="fb-intent"></span></div>';
                    card.innerHTML = html;

                    var btns = card.querySelectorAll('.opt-btn');
                    for (var b = 0; b < btns.length; b++) {
                        (function(btn, c, qq) {
                            btn.addEventListener('click', function(e) {
                                e.stopPropagation();
                                if (c.classList.contains('answered')) return;
                                var sel = btn.getAttribute('data-opt');
                                var ok = (parseInt(sel) === qq.ans);
                                var allB = c.querySelectorAll('.opt-btn');
                                for (var ab = 0; ab < allB.length; ab++) allB[ab].style.pointerEvents = 'none';
                                var cb = c.querySelector('.opt-btn[data-opt="' + qq.ans + '"]');
                                if (cb) cb.classList.add('correct-answer');
                                if (!ok) btn.classList.add('wrong-answer');
                                c.classList.add('answered');
                                c.classList.add(ok ? 'correct' : 'wrong');
                                var fb = c.querySelector('.fb');
                                fb.classList.add(ok ? 'ok' : 'no');
                                fb.querySelector('.fb-text').textContent = ok ? '答对了' : '答错了';
                                fb.querySelector('.fb-method').textContent = '思路：' + (qq.tip || '');
                                fb.querySelector('.fb-intent').textContent = '出题者意图：' + (qq.intent || '');
                                totalAnswered++;
                                if (ok) totalCorrect++; else addToWrongList(qq, sel);
                                updateScore();
                                if (window.MathJax && window.MathJax.typesetPromise) MathJax.typesetPromise([c]).catch(function(){});
                            });
                        })(btns[b], card, q);
                    }
                    cardGrid.appendChild(card);
                }
                if (window.MathJax && window.MathJax.typesetPromise) MathJax.typesetPromise([cardGrid]).catch(function(){});
            }

            function showWrongBook() {
                if (wrongList.length === 0) {
                    wrongListDiv.innerHTML = '<div class="empty">暂无错题，继续保持！</div>';
                } else {
                    var html = '<p style="font-size:0.7rem;color:#888;margin-bottom:6px;">共 ' + wrongList.length + ' 道错题</p>';
                    for (var i = 0; i < wrongList.length; i++) {
                        var w = wrongList[i];
                        html += '<div class="wrong-item">';
                        html += '<div class="wq">' + w.tag + '：' + w.q + '</div>';
                        html += '<div class="wa">正确答案：' + (w.opts ? w.opts[w.ans] : '') + '</div>';
                        html += '<div class="wt">思路：' + (w.tip || '') + '</div>';
                        html += '</div>';
                    }
                    wrongListDiv.innerHTML = html;
                }
                modalOverlay.classList.add('show');
            }

            function hideWrongBook() { modalOverlay.classList.remove('show'); }

            function reset() { totalCorrect = 0; totalAnswered = 0; updateScore(); renderCards(); }

            for (var i = 0; i < tabBtns.length; i++) {
                (function(b) {
                    b.addEventListener('click', function(e) {
                        e.preventDefault();
                        for (var j = 0; j < tabBtns.length; j++) tabBtns[j].classList.remove('active');
                        b.classList.add('active');
                        currentModule = b.getAttribute('data-module');
                        reset();
                    });
                })(tabBtns[i]);
            }

            document.getElementById('refreshBtn').addEventListener('click', function(e) { e.preventDefault(); reset(); });
            document.getElementById('resetBtn').addEventListener('click', function(e) { e.preventDefault(); reset(); });
            document.getElementById('wrongBookBtn').addEventListener('click', function(e) { e.preventDefault(); showWrongBook(); });
            document.getElementById('closeModal').addEventListener('click', function(e) { e.preventDefault(); hideWrongBook(); });
            modalOverlay.addEventListener('click', function(e) { if (e.target === modalOverlay) hideWrongBook(); });

            updateScore();
            renderCards();
        }

        if (window.MathJax && window.MathJax.startup) {
            window.MathJax.startup.promise.then(init);
        } else {
            window.addEventListener('load', function() {
                if (window.MathJax && window.MathJax.startup) {
                    window.MathJax.startup.promise.then(init);
                } else { init(); }
            });
        }
    })();
    </script>
</body>
</html>
