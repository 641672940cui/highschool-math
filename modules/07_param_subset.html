            background: #c8e6c9;

        /* ========== 响应式 ========== */
        @media (max-width: 650px) {
            .container {
                padding: 1.4rem;

                padding: 1.2rem;
            }
            .options-row {
                flex-direction: column;
            }
            button {
                width: 100%;
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🔍 参数子集思想</h1>
            <div class="subtitle">从"含参集合关系"中提炼参数条件 · 四题递进探究</div>
        </div>

        <!-- 知识点卡片 -->
        <div class="knowledge-card">
            <h2>📘 找参数的通用四步</h2>
            <div class="step-list">
                <div class="step-item">
                    <div class="step-num">1</div>
                    <div class="step-content"><strong>定集合：</strong>先把不含参数的集合具体算出来（解方程、化简不等式为区间）。</div>
                </div>
                <div class="step-item">
                    <div class="step-num">2</div>
                    <div class="step-content"><strong>翻关系：</strong>把<span class="highlight">子集关系</span>翻译成元素属于条件（$B \subseteq A$ 即 $B$ 的元素都在 $A$ 中）。</div>
                </div>
                <div class="step-item">
                    <div class="step-num">3</div>
                    <div class="step-content"><strong>讨论空集：</strong>参数集合可能为空集！<span class="highlight">空集是任何集合的子集</span>，千万别漏。</div>
                </div>
                <div class="step-item">
                    <div class="step-num">4</div>
                    <div class="step-content"><strong>列式合并：</strong>非空时列方程/不等式解出参数，与空集情况合并，写出最终答案。</div>
                </div>
            </div>
        </div>

        <!-- 题目将由JS动态生成 -->
        <div id="problems-container"></div>
    </div>

    <script>
        (function() {
            // ==================== 题目数据 ====================
            const problemsData = [{
                id: 1,
                difficulty: 2,
                title: "题1 · 一次区间含参 ",
                fullTitle: "已知 $A = \\{x \\mid -3 \\le x \\le 4\\}$，$B = \\{x \\mid 2k-1 \\le x \\le k+3\\}$，若 $B \\subseteq A$，求实数 $k$ 的取值范围。",
                steps: [{
                    header: "第1步 · 定集合",
                    prompt: "请把集合 $A$ 和 $B$ 分别写成区间形式。$A$ 是什么区间？",
                    options: [
                        "$A = [-3, 4]$，$B = [2k-1, k+3]$",
                        "$A = (-3, 4)$，$B = (2k-1, k+3)$",
                        "$A = \\{-3, -2, -1, 0, 1, 2, 3, 4\\}$",
                        "$A = [-3, 4)$，$B = [2k-1, k+3)$"
                    ],
                    correct: 0,
                    hint: "$A$ 的条件是 $-3 \\le x \\le 4$，包含端点，所以是闭区间。$B$ 同理。",
                    explanation: "正确！$A = [-3, 4]$ 是闭区间，$B = [2k-1, k+3]$ 是含参闭区间。"
                }, {
                    header: "第2步 · 空集讨论",
                    prompt: "区间 $B = [2k-1, k+3]$ 什么时候是空集？为什么这一步不能漏？",
                    options: [
                        "当 $2k-1 > k+3$ 即 $k > 4$ 时，$B = \\varnothing$。空集自动满足子集关系",
                        "$B$ 不可能是空集，因为区间总存在",
                        "当 $k = 0$ 时 $B$ 为空集",
                        "空集情况不影响最终答案，可以跳过"
                    ],
                    correct: 0,
                    hint: "区间左端点大于右端点时区间为空。空集是任何集合的子集，这部分 $k$ 全部成立。",
                    explanation: "正确！当 $2k-1 > k+3$，即 $k > 4$ 时，$B = \\varnothing$，自动满足 $B \\subseteq A$。这是最容易漏掉的情况！"
                }, {
                    header: "第3步 · 非空时的条件",
                    prompt: "当 $k \\le 4$ 时 $B$ 非空。要使 $B \\subseteq A = [-3, 4]$，需要满足什么条件？",
                    options: [
                        "$2k-1 \\ge -3$ 且 $k+3 \\le 4$",
                        "$2k-1 \\le -3$ 且 $k+3 \\ge 4$",
                        "$2k-1 = -3$ 且 $k+3 = 4$",
                        "只需 $k+3 \\le 4$"
                    ],
                    correct: 0,
                    hint: "区间 $B$ 要包含于 $A$，$B$ 的左端点不能低于 $A$ 的左端点，右端点不能超过 $A$ 的右端点。",
                    explanation: "正确！需满足 $2k-1 \\ge -3$ 且 $k+3 \\le 4$。注意用 $\\ge$ 和 $\\le$，因为端点重合也是子集。"
                }, {
                    header: "第4步 · 解不等式并合并",
                    prompt: "解不等式组，并与空集情况 $k > 4$ 合并，最终 $k$ 的取值范围是什么？",
                    options: [
                        "$k \\in [-1, 1] \\cup (4, +\\infty)$",
                        "$k \\in [-1, 1]$",
                        "$k \\in (4, +\\infty)$",
                        "$k \\in [-1, 4]$"
                    ],
                    correct: 0,
                    hint: "解 $2k-1 \\ge -3$ 得 $k \\ge -1$；解 $k+3 \\le 4$ 得 $k \\le 1$。结合前提 $k \\le 4$ 得 $-1 \\le k \\le 1$。再与 $k > 4$ 合并。",
                    explanation: "正确！非空时 $-1 \\le k \\le 1$，空集时 $k > 4$，合并得 $k \\in [-1, 1] \\cup (4, +\\infty)$。"
                }],
                solution: `<strong>【标准答案】</strong><br><br>
                <strong>解：</strong>由题意，$A = [-3, 4]$，$B = [2k-1, k+3]$。<br><br>
                <strong>（1）当 $B = \\varnothing$ 时</strong><br>
                由 $2k-1 > k+3$，解得 $k > 4$。<br>
                因为空集是任何集合的子集，所以 $k > 4$ 时 $B \\subseteq A$ 成立。<br><br>
                <strong>（2）当 $B \\neq \\varnothing$ 时</strong><br>
                由 $2k-1 \\le k+3$，得 $k \\le 4$。<br>
                要使 $B \\subseteq A = [-3, 4]$，需同时满足：<br>
                · 左端点条件：$2k-1 \\ge -3$，解得 $k \\ge -1$<br>
                · 右端点条件：$k+3 \\le 4$，解得 $k \\le 1$<br>
                结合前提 $k \\le 4$，取交集得 $-1 \\le k \\le 1$。<br><br>
                <strong>（3）综上所述</strong><br>
                合并（1）（2）得 $k$ 的取值范围为 $[-1, 1] \\cup (4, +\\infty)$。<br><br>
                <strong>答：实数 $k$ 的取值范围是 $[-1, 1] \\cup (4, +\\infty)$。</strong>`
            }, {
                id: 2,
                difficulty: 3,
                title: "题2 · 二次方程含参 ",
                fullTitle: "已知 $A = \\{1, 2\\}$，$B = \\{x \\mid mx^2 - 3x + 2 = 0\\}$，若 $B \\subseteq A$，求实数 $m$ 的取值范围。",
                steps: [{
                    header: "第1步 · 定集合",
                    prompt: "集合 $A$ 的元素是什么？集合 $B$ 代表什么？",
                    options: [
                        "$A = \\{1, 2\\}$，$B$ 是方程 $mx^2 - 3x + 2 = 0$ 的实数解集",
                        "$A = \\{x \\mid x^2 - 3x + 2 = 0\\}$，$B$ 是二次不等式的解集",
                        "$A = \\varnothing$",
                        "$A = \\{0, 1, 2\\}$"
                    ],
                    correct: 0,
                    hint: "题目直接给出 $A = \\{1, 2\\}$。$B$ 是方程的解集，元素是方程的实数根。",
                    explanation: "正确！$A = \\{1, 2\\}$ 有两个元素，$B$ 中的元素（如果有）必须是方程 $mx^2 - 3x + 2 = 0$ 的实数解。"
                }, {
                    header: "第2步 · $m=0$ 的特殊情况",
                    prompt: "参数 $m$ 在二次项系数位置。当 $m=0$ 时会发生什么？",
                    options: [
                        "方程退化为一次方程 $-3x+2=0$，解为 $x=\\frac{2}{3}$，不属于 $A$",
                        "$m=0$ 时方程无解",
                        "$m=0$ 时方程解为 $x=1$，属于 $A$",
                        "$m$ 不能为 $0$，因为题目说的是二次方程"
                    ],
                    correct: 0,
                    hint: "$m=0$ 时 $mx^2$ 项消失，方程变成 $-3x+2=0$。解出 $x$ 后验证是否在 $A$ 中。",
                    explanation: "正确！$m=0$ 时方程为一次方程，解为 $x=\\frac{2}{3} \\notin A$，不满足条件。"
                }, {
                    header: "第3步 · $m \\neq 0$ 时的空集情况",
                    prompt: "$m \\neq 0$ 时方程为二次方程。什么情况下 $B = \\varnothing$（空集）？",
                    options: [
                        "判别式 $\\Delta = 9 - 8m < 0$，即 $m > \\frac{9}{8}$",
                        "$m < 0$ 时为空集",
                        "判别式 $\\Delta = 0$ 时为空集",
                        "二次方程总有解，不会为空集"
                    ],
                    correct: 0,
                    hint: "二次方程无实数解的条件是 $\\Delta < 0$。计算 $\\Delta = (-3)^2 - 4 \\cdot m \\cdot 2 = 9 - 8m$。",
                    explanation: "正确！当 $\\Delta = 9 - 8m < 0$，即 $m > \\frac{9}{8}$ 时，方程无实数解，$B = \\varnothing$，自动满足子集条件。"
                }, {
                    header: "第4步 · 非空时代入验证与合并",
                    prompt: "$m \\le \\frac{9}{8}$ 且 $m \\neq 0$ 时方程有解。把 $x=1$ 和 $x=2$ 代入，最终 $m$ 的取值是什么？",
                    options: [
                        "$m = 1$ 或 $m > \\frac{9}{8}$",
                        "只有 $m = 1$",
                        "$m = 1$ 或 $m = \\frac{9}{8}$",
                        "$m \\ge \\frac{9}{8}$"
                    ],
                    correct: 0,
                    hint: "$x=1$ 代入得 $m-3+2=0 \\Rightarrow m=1$，此时方程解为 $\\{1, 2\\}$。$x=2$ 代入也得 $m=1$。$\\Delta=0$ 时 $m=\\frac{9}{8}$，解为 $x=\\frac{4}{3} \\notin A$。综合空集情况得最终答案。",
                    explanation: "正确！$m=1$ 时 $B=\\{1,2\\} \\subseteq A$；$m > \\frac{9}{8}$ 时 $B=\\varnothing \\subseteq A$。最终答案为 $m \\in \\{1\\} \\cup (\\frac{9}{8}, +\\infty)$。"
                }],
                solution: `<strong>【标准答案】</strong><br><br>
                <strong>解：</strong>由题意，$A = \\{1, 2\\}$，$B$ 是方程 $mx^2 - 3x + 2 = 0$ 的实数解集。<br><br>
                <strong>（1）当 $m = 0$ 时</strong><br>
                方程为 $-3x + 2 = 0$，解得 $x = \\frac{2}{3}$。<br>
                $B = \\{\\frac{2}{3}\\}$，$\\frac{2}{3} \\notin A$，不满足条件。<br><br>
                <strong>（2）当 $m \\neq 0$ 时</strong><br>
                方程为二次方程，判别式 $\\Delta = (-3)^2 - 4 \\cdot m \\cdot 2 = 9 - 8m$。<br>
                · 若 $\\Delta < 0$，即 $m > \\frac{9}{8}$，方程无实数解，$B = \\varnothing \\subseteq A$，满足条件。<br>
                · 若 $\\Delta \\ge 0$，即 $m \\le \\frac{9}{8}$，方程有实数解。要使 $B \\subseteq A$，解只能是 $1$ 或 $2$。<br>
                　- 将 $x=1$ 代入：$m - 3 + 2 = 0 \\Rightarrow m = 1$。<br>
                　　此时方程为 $x^2 - 3x + 2 = 0$，解得 $x=1$ 或 $x=2$，$B = \\{1, 2\\} \\subseteq A$。<br>
                　- 将 $x=2$ 代入：$4m - 6 + 2 = 0 \\Rightarrow m = 1$，同上。<br>
                　- 若 $\\Delta = 0$，即 $m = \\frac{9}{8}$，方程为 $\\frac{9}{8}x^2 - 3x + 2 = 0$，<br>
                　　解得 $x = \\frac{4}{3} \\notin A$，不满足条件。<br><br>
                <strong>（3）综上所述</strong><br>
                满足条件的 $m$ 为 $m = 1$ 或 $m > \\frac{9}{8}$。<br><br>
                <strong>答：实数 $m$ 的取值范围是 $\\{1\\} \\cup (\\frac{9}{8}, +\\infty)$。</strong>`
            }, {

            // ==================== 渲染题目 ====================
            const container = document.getElementById('problems-container');

            function renderAllProblems() {
                container.innerHTML = '';
                problemsData.forEach(problem => {
                    const card = document.createElement('div');
                    card.className = 'problem-card';
                    card.id = `problem-${problem.id}`;

                    const diffClass = `diff-${problem.difficulty}`;
                    const diffStars = '⭐'.repeat(problem.difficulty);

                    let html = `
                        <div class="problem-title mathjax-process">
                            ${problem.title}
                            <span class="difficulty ${diffClass}">${diffStars}</span>
                            <br><span style="font-weight:400;">${problem.fullTitle}</span>
                        </div>
                    `;

                    // 渲染步骤
                    problem.steps.forEach((step, stepIdx) => {
                        html += `
                            <div class="step-block" id="prob-${problem.id}-step-${stepIdx}" style="${stepIdx === 0 ? 'opacity:1;' : ''}">
                                <div class="step-header">
                                    <span class="step-badge">${stepIdx + 1}</span>
                                    <span>${step.header}</span>
                                    ${stepIdx === 0 ? '<span style="font-size:0.78rem;color:#e67e22;">👈 当前步骤</span>' : ''}
                                </div>
                                <div class="prompt-text mathjax-process">💡 ${step.prompt}</div>
                                <div class="options-row" id="prob-${problem.id}-step-${stepIdx}-opts">
                                    ${step.options.map((opt, optIdx) => `
                                        <button onclick="checkAnswer(${problem.id}, ${stepIdx}, ${optIdx}, this)" ${stepIdx > 0 ? 'disabled' : ''}>${opt}</button>
                                    `).join('')}
                                </div>
                                <div id="prob-${problem.id}-step-${stepIdx}-fb"></div>
                            </div>
                        `;
                    });

                    // 标准答案折叠区
                    html += `
                        <button class="solution-toggle" onclick="toggleSolution(${problem.id}, this)">📝 查看标准答案</button>
                        <div class="solution-content mathjax-process" id="prob-${problem.id}-solution">
                            ${problem.solution}
                        </div>
                    `;

                    card.innerHTML = html;
                    container.appendChild(card);
                });

                if (window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise();
                }
            }

            // ==================== 检查答案 ====================
            window.checkAnswer = function(problemId, stepIdx, selectedOptIdx, btnElement) {
                const problem = problemsData.find(p => p.id === problemId);
                if (!problem) return;
                const step = problem.steps[stepIdx];
                const isCorrect = (selectedOptIdx === step.correct);
                const fbDiv = document.getElementById(`prob-${problemId}-step-${stepIdx}-fb`);
                const optsContainer = document.getElementById(`prob-${problemId}-step-${stepIdx}-opts`);
                const stepBlock = document.getElementById(`prob-${problemId}-step-${stepIdx}`);

                const allBtns = optsContainer.querySelectorAll('button');
                allBtns.forEach(b => b.disabled = true);

                allBtns.forEach(b => {
                    const match = b.getAttribute('onclick').match(/checkAnswer\((\d+),\s*(\d+),\s*(\d+)/);
                    if (match && parseInt(match[3]) === step.correct) {
                        b.classList.add('correct-choice');
                    }
                });

                if (!isCorrect) {
                    btnElement.classList.add('wrong-choice');
                    fbDiv.innerHTML = `<div class="hint-box mathjax-process">❌ 不对哦。提示：${step.hint}</div>`;
                    setTimeout(() => {
                        allBtns.forEach(b => {
                            b.disabled = false;
                            b.classList.remove('correct-choice', 'wrong-choice');
                        });
                        fbDiv.innerHTML = '';
                    }, 2500);
                } else {
                    stepBlock.classList.add('completed');
                    stepBlock.querySelector('.step-badge').textContent = '✓';
                    fbDiv.innerHTML = `<div class="result-box mathjax-process">✅ 正确！${step.explanation}</div>`;

                    if (stepIdx + 1 < problem.steps.length) {
                        const nextBlock = document.getElementById(`prob-${problemId}-step-${stepIdx + 1}`);
                        nextBlock.style.opacity = '1';
                        nextBlock.classList.add('active-step');
                        const nextHeader = nextBlock.querySelector('.step-header');
                        nextHeader.innerHTML = nextHeader.innerHTML.replace('👈 当前步骤', '');
                        nextHeader.innerHTML +=
                            '<span style="font-size:0.78rem;color:#e67e22;">👈 当前步骤</span>';
                        const nextBtns = nextBlock.querySelectorAll('button');
                        nextBtns.forEach(b => b.disabled = false);
                    } else {
                        const card = document.getElementById(`problem-${problemId}`);
                        const congrats = document.createElement('div');
                        congrats.className = 'congrats';
                        congrats.innerHTML = '🎉 恭喜！本题所有步骤完成！点击下方按钮查看标准答案。';
                        card.appendChild(congrats);
                    }
                }

                if (window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise();
                }
            };

            // ==================== 切换标准答案 ====================
            window.toggleSolution = function(problemId, btn) {
                const solutionDiv = document.getElementById(`prob-${problemId}-solution`);
                if (solutionDiv.classList.contains('show')) {
                    solutionDiv.classList.remove('show');
                    btn.textContent = '📝 查看标准答案';
                } else {
                    solutionDiv.classList.add('show');
                    btn.textContent = '📝 隐藏标准答案';
                    if (window.MathJax && MathJax.typesetPromise) {
                        MathJax.typesetPromise();
                    }
                }
            };

            // ==================== 初始化 ====================
            renderAllProblems();
        })();
    </script>
