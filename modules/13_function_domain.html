<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>定义域 · 10题闯关</title>
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            options: { enableMenu: false, ignoreHtmlClass: 'no-mathjax' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async>
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f1f5f9;
            padding: 16px 12px 40px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 680px;
            width: 100%;
        }
        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #fff;
            border-radius: 28px;
            padding: 20px 18px 18px;
            margin-bottom: 24px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 small {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.7;
            margin-left: auto;
        }
        .header .sub {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 4px;
        }
        .back-link {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            text-decoration: none;
            margin-top: 8px;
            transition: 0.2s;
        }
        .back-link:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .knowledge-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 14px 16px;
            margin: 6px 0 14px;
            border-left: 5px solid #3b82f6;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }
        .knowledge-card .kc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #0f172a;
            font-size: 15px;
        }
        .knowledge-card .kc-header .arrow {
            transition: transform 0.25s;
            font-size: 18px;
        }
        .knowledge-card .kc-header .arrow.collapsed {
            transform: rotate(-90deg);
        }
        .knowledge-card .kc-body {
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.8;
            color: #1e293b;
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.25s ease;
            max-height: 1200px;
            opacity: 1;
        }
        .knowledge-card .kc-body.hidden {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }
        .knowledge-card .kc-body .example {
            background: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            margin: 6px 0 2px;
            border: 1px solid #e2e8f0;
            font-size: 15px;
        }
        .knowledge-card .kc-body .example .tag {
            display: inline-block;
            background: #dbeafe;
            font-size: 12px;
            padding: 0 10px;
            border-radius: 20px;
            color: #1d4ed8;
        }
        .knowledge-card .kc-body ul {
            padding-left: 20px;
            margin: 4px 0;
        }
        .knowledge-card .kc-body ul li {
            margin-bottom: 2px;
        }
        .knowledge-card .kc-body mjx-container {
            display: inline-block !important;
            vertical-align: middle !important;
        }
        .progress-wrap {
            background: #e2e8f0;
            height: 6px;
            border-radius: 10px;
            margin: 10px 0 6px;
            overflow: hidden;
        }
        .progress-wrap .fill {
            height: 100%;
            background: #3b82f6;
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-label {
            font-size: 13px;
            color: #64748b;
            text-align: right;
        }
        .question-item {
            background: #f8fafc;
            border-radius: 18px;
            padding: 16px 16px 14px;
            margin-top: 18px;
            border-left: 4px solid #94a3b8;
            transition: border-color 0.2s;
        }
        .question-item.correct {
            border-left-color: #22c55e;
        }
        .question-item.wrong {
            border-left-color: #ef4444;
        }
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 4px 8px;
        }
        .q-header .q-label {
            font-weight: 600;
            font-size: 15px;
            color: #0f172a;
        }
        .q-header .difficulty {
            font-size: 12px;
            padding: 1px 12px;
            border-radius: 30px;
            background: #e2e8f0;
            color: #475569;
            font-weight: 500;
        }
        .q-header .difficulty.easy {
            background: #dcfce7;
            color: #166534;
        }
        .q-header .difficulty.medium {
            background: #fef9c3;
            color: #854d0e;
        }
        .q-header .difficulty.hard {
            background: #fee2e2;
            color: #991b1b;
        }
        .q-text {
            font-size: 16px;
            font-weight: 500;
            line-height: 2.2;
            margin-bottom: 12px;
        }
        .q-text mjx-container {
            display: inline-block !important;
            vertical-align: middle !important;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .options label {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #fff;
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            transition: all 0.15s;
            cursor: pointer;
            font-size: 15px;
            line-height: 1.8;
        }
        .options label:active {
            background: #f1f5f9;
        }
        .options label mjx-container {
            display: inline-block !important;
            vertical-align: middle !important;
        }
        .options input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            flex-shrink: 0;
            cursor: pointer;
        }
        .options label.disabled {
            opacity: 0.7;
            cursor: default;
        }
        .options label.disabled:active {
            background: #fff;
        }
        .feedback {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 14px;
            font-size: 14px;
            display: none;
            line-height: 1.8;
        }
        .feedback.show {
            display: block;
        }
        .feedback.correct {
            background: #dcfce7;
            color: #166534;
            border-left: 4px solid #22c55e;
        }
        .feedback.wrong {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }
        .feedback .explain {
            margin-top: 6px;
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 10px;
            color: #1e293b;
            font-size: 14px;
        }
        .feedback .explain .skill {
            display: inline-block;
            background: #fef08a;
            padding: 1px 8px;
            border-radius: 4px;
            font-weight: 600;
            margin-right: 4px;
        }
        .feedback .explain mjx-container {
            display: inline-block !important;
            vertical-align: middle !important;
        }
        .reset-area {
            text-align: center;
            margin-top: 28px;
        }
        .btn-reset {
            background: transparent;
            border: 1px solid #cbd5e1;
            padding: 8px 32px;
            border-radius: 40px;
            color: #475569;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-reset:active {
            background: #f1f5f9;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>📐 函数专题 · 定义域 <small>10题</small></h1>
            <div class="sub">知识卡片复习 · 逐题闯关 · 解析含技巧标黄</div>
            <a class="back-link" href="../index.html">← 返回工具箱</a>
        </div>
        <div id="panelContainer"></div>
        <div class="reset-area">
            <button class="btn-reset" id="resetBtn">⟳ 重置进度</button>
        </div>
        <div class="footer">内容来自 B站 @一数 · 不涉及对数</div>
    </div>
    <script>
        (function() {
            var TOTAL_QS = 10;
            var MODULE_ID = '13_function_domain';

            var levelData = {
                knowledge: {
                    title: '📖 定义域核心规则',
                    points: [
                        '① 分式：分母 ≠ 0',
                        '② 偶次根式：被开方数 ≥ 0',
                        '③ 抽象函数：括号内范围不变，整体代换'
                    ],
                    example: '已知 f(x) 定义域为 [0,3]，求 f(2x-1) 定义域：$0 \\le 2x-1 \\le 3 \\rightarrow \\frac12 \\le x \\le 2$'
                },
                questions: [{
                    q: '$f(x) = \\sqrt{x-2} + \\dfrac{1}{x+1}$ 的定义域为？',
                    options: ['$[2, +\\infty)$', '$(-1, 2]$', '$[2, +\\infty) \\cup \\{-1\\}$',
                        '$[2, +\\infty)$ 且 $x \\neq -1$'
                    ],
                    correct: 0,
                    difficulty: 'easy',
                    explain: '【技巧】根式要求 $x-2 \\ge 0 \\rightarrow x \\ge 2$；分式要求 $x+1 \\neq 0 \\rightarrow x \\neq -1$。但 $x \\ge 2$ 已经排除了 $x=-1$，所以定义域最简形式为 $[2, +\\infty)$，选A。'
                }, {
                    q: '$f(x) = \\sqrt{3-x} + \\dfrac{1}{x-2}$ 的定义域为？',
                    options: ['$(-\\infty, 2) \\cup (2, 3]$', '$(-\\infty, 3]$', '$(-\\infty, 2)$', '$(2, 3]$'],
                    correct: 0,
                    difficulty: 'easy',
                    explain: '【技巧】$3-x \\ge 0 \\rightarrow x \\le 3$；$x-2 \\neq 0 \\rightarrow x \\neq 2$。取交集得 $(-\\infty, 2) \\cup (2, 3]$，选A。'
                }, {
                    q: '$f(x) = \\sqrt{x^2-4} + \\dfrac{1}{x-3}$ 的定义域为？',
                    options: ['$(-\\infty, -2] \\cup [2, 3) \\cup (3, +\\infty)$', '$[-2, 2]$',
                        '$(-\\infty, -2] \\cup [2, +\\infty)$', '$(-\\infty, 3) \\cup (3, +\\infty)$'
                    ],
                    correct: 0,
                    difficulty: 'easy',
                    explain: '【技巧】$x^2-4 \\ge 0 \\rightarrow x \\le -2$ 或 $x \\ge 2$；$x \\neq 3$。合并得 $(-\\infty, -2] \\cup [2, 3) \\cup (3, +\\infty)$，选A。'
                }, {
                    q: '已知 $f(x)$ 定义域为 $[0, 3]$，求 $f(2x-1)$ 的定义域',
                    options: ['$[0, 3]$', '$[\\frac12, 2]$', '$[1, 5]$', '$[-1, 4]$'],
                    correct: 1,
                    difficulty: 'medium',
                    explain: '【技巧】抽象函数括号范围不变：$0 \\le 2x-1 \\le 3 \\rightarrow \\frac12 \\le x \\le 2$，即 $[\\frac12, 2]$，选B。'
                }, {
                    q: '已知 $f(x)$ 定义域为 $[-1, 2]$，求 $f(x^2-1)$ 的定义域',
                    options: ['$[-\\sqrt3, -1] \\cup [1, \\sqrt3]$', '$[-\\sqrt3, \\sqrt3]$',
                        '$[-\\sqrt3, -\\sqrt2] \\cup [\\sqrt2, \\sqrt3]$', '$[-1, 1]$'
                    ],
                    correct: 1,
                    difficulty: 'medium',
                    explain: '【技巧】括号范围不变：$-1 \\le x^2-1 \\le 2$，加1得 $0 \\le x^2 \\le 3$，开方得 $-\\sqrt3 \\le x \\le \\sqrt3$，选B。'
                }, {
                    q: '已知 $f(2x+1)$ 的定义域为 $[0, 2]$，求 $f(x)$ 的定义域',
                    options: ['$[1, 5]$', '$[0, 2]$', '$[0, 5]$', '$[1, 3]$'],
                    correct: 0,
                    difficulty: 'medium',
                    explain: '【技巧】$x \\in [0, 2] \\rightarrow 2x+1 \\in [1, 5]$，故 $f(x)$ 定义域为 $[1, 5]$，选A。'
                }, {
                    q: '已知 $f(x)$ 定义域为 $[-2, 4]$，求 $f(x+1) + f(x-1)$ 的定义域',
                    options: ['$[-3, 3]$', '$[-1, 3]$', '$[-1, 5]$', '$[-3, 5]$'],
                    correct: 1,
                    difficulty: 'medium',
                    explain: '【技巧】两个括号都要在 $[-2, 4]$ 内：$-2 \\le x+1 \\le 4 \\rightarrow -3 \\le x \\le 3$；$-2 \\le x-1 \\le 4 \\rightarrow -1 \\le x \\le 5$。取交集 $[-1, 3]$，选B。'
                }, {
                    q: '$f(x) = \\sqrt{2-x} + \\sqrt{x}$ 的定义域为？',
                    options: ['$[0, +\\infty)$', '$[0, 2]$', '$(-\\infty, 2]$', '$\\mathbb{R}$'],
                    correct: 1,
                    difficulty: 'easy',
                    explain: '【技巧】$2-x \\ge 0 \\rightarrow x \\le 2$；$x \\ge 0$。交集 $[0, 2]$，选B。'
                }, {
                    q: '已知 $f(x)$ 定义域为 $[1, 9]$，求 $f(\\sqrt{x})$ 的定义域',
                    options: ['$[1, 3]$', '$[1, 81]$', '$[1, 9]$', '$[3, 9]$'],
                    correct: 1,
                    difficulty: 'hard',
                    explain: '【技巧】$1 \\le \\sqrt{x} \\le 9 \\rightarrow 1 \\le x \\le 81$，选B。'
                }, {
                    q: '已知 $f(2x-1)$ 的定义域为 $[1, 3]$，求 $f(x^2)$ 的定义域',
                    options: ['$[1, 5]$', '$[-\\sqrt5, \\sqrt5]$', '$[-\\sqrt5, -1] \\cup [1, \\sqrt5]$',
                        '$[-1, 1]$'
                    ],
                    correct: 2,
                    difficulty: 'hard',
                    explain: '【技巧】$x \\in [1, 3] \\rightarrow 2x-1 \\in [1, 5]$，故 $f(t)$ 定义域为 $[1, 5]$。令 $1 \\le x^2 \\le 5 \\rightarrow x \\in [-\\sqrt5, -1] \\cup [1, \\sqrt5]$，选C。'
                }]
            };

            var status = { answers: Array(TOTAL_QS).fill(null) };
            var panelContainer = document.getElementById('panelContainer');

            function getProgress() {
                var correct = status.answers.filter(function(a) { return a === true; }).length;
                return (correct / TOTAL_QS) * 100;
            }

            function getScoreStr() {
                var correct = status.answers.filter(function(a) { return a === true; }).length;
                return correct + '/' + TOTAL_QS;
            }

            function isAllCorrect() {
                return status.answers.every(function(a) { return a === true; });
            }

            function syncStorage() {
                try {
                    var completed = JSON.parse(localStorage.getItem('dongdong_modules') || '[]');
                    if (isAllCorrect()) {
                        if (!completed.includes(MODULE_ID)) {
                            completed.push(MODULE_ID);
                            localStorage.setItem('dongdong_modules', JSON.stringify(completed));
                        }
                    } else {
                        var idx = completed.indexOf(MODULE_ID);
                        if (idx !== -1) {
                            completed.splice(idx, 1);
                            localStorage.setItem('dongdong_modules', JSON.stringify(completed));
                        }
                    }
                } catch (e) {}
            }

            function render() {
                var html = '';
                var kc = levelData.knowledge;

                html += '<div class="knowledge-card" data-kc="0">' +
                    '<div class="kc-header"><span>' + kc.title + '</span><span class="arrow" id="kcArrow">▼</span></div>' +
                    '<div class="kc-body" id="kcBody"><ul>';
                kc.points.forEach(function(p) { html += '<li>' + p + '</li>'; });
                html += '</ul><div class="example"><span class="tag">例</span> ' + kc.example + '</div></div></div>';

                var progress = getProgress();
                html += '<div class="progress-wrap"><div class="fill" style="width:' + progress +
                '%;"></div></div>';
                html += '<div class="progress-label">' + getScoreStr() + ' 题通过</div>';

                levelData.questions.forEach(function(q, qIdx) {
                    var answer = status.answers[qIdx];
                    var isCorrect = (answer === true);
                    var isWrong = (answer === false);
                    var isAnswered = (answer !== null);
                    var itemClass = 'question-item';
                    if (isCorrect) itemClass += ' correct';
                    else if (isWrong) itemClass += ' wrong';
                    var diffMap = { easy: '⭐ 基础', medium: '⭐⭐ 中档', hard: '⭐⭐⭐ 拔高' };
                    var diffLabel = diffMap[q.difficulty] || '';
                    html += '<div class="' + itemClass + '" data-qidx="' + qIdx + '">';
                    html += '<div class="q-header"><span class="q-label">第 ' + (qIdx + 1) +
                        ' 题</span><span class="difficulty ' + q.difficulty + '">' + diffLabel + '</span></div>';
                    html += '<div class="q-text">' + q.q + '</div><div class="options">';
                    q.options.forEach(function(opt, oIdx) {
                        var checked = (isAnswered && q.correct === oIdx) ? 'checked' : '';
                        var disabled = isAnswered ? 'disabled' : '';
                        var labelClass = isAnswered ? 'disabled' : '';
                        html += '<label class="' + labelClass + '"><input type="radio" name="q' + qIdx +
                            '" value="' + oIdx + '" ' + checked + ' ' + disabled +
                            ' data-q="' + qIdx + '" data-opt="' + oIdx + '">' +
                            String.fromCharCode(65 + oIdx) + '. ' + opt + '</label>';
                    });
                    html += '</div>';
                    var feedbackClass = 'feedback';
                    var showClass = '';
                    var correctText = '';
                    var explainHtml = '';
                    if (isAnswered) {
                        showClass = 'show';
                        if (isCorrect) { feedbackClass += ' correct';
                            correctText = '✅ 正确！'; } else { feedbackClass += ' wrong';
                            correctText = '❌ 再想想'; }
                        var explainText = q.explain || '';
                        explainText = explainText.replace(/【技巧】/g, '<span class="skill">【技巧】</span>');
                        explainHtml = '<div class="explain">' + explainText + '</div>';
                    }
                    html += '<div class="' + feedbackClass + ' ' + showClass + '">' + correctText + explainHtml +
                        '</div></div>';
                });

                panelContainer.innerHTML = html;

                var card = document.querySelector('.knowledge-card');
                if (card) {
                    card.addEventListener('click', function() {
                        var body = document.getElementById('kcBody');
                        var arrow = document.getElementById('kcArrow');
                        if (body && arrow) { body.classList.toggle('hidden');
                            arrow.classList.toggle('collapsed'); }
                    });
                }

                document.querySelectorAll('.options input[type="radio"]:not([disabled])').forEach(function(radio) {
                    radio.addEventListener('change', function() {
                        var qIdx = parseInt(this.dataset.q, 10);
                        var optIdx = parseInt(this.dataset.opt, 10);
                        if (isNaN(qIdx) || isNaN(optIdx)) return;
                        if (status.answers[qIdx] !== null) return;
                        var correct = levelData.questions[qIdx].correct;
                        status.answers[qIdx] = (optIdx === correct);
                        syncStorage();
                        render();
                        if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise(); }
                    });
                });
            }

            function resetAll() {
                if (confirm('重置本模块进度？')) {
                    status.answers = Array(TOTAL_QS).fill(null);
                    try {
                        var completed = JSON.parse(localStorage.getItem('dongdong_modules') || '[]');
                        var idx = completed.indexOf(MODULE_ID);
                        if (idx !== -1) { completed.splice(idx, 1);
                            localStorage.setItem('dongdong_modules', JSON.stringify(completed)); }
                    } catch (e) {}
                    render();
                    if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise(); }
                }
            }

            document.getElementById('resetBtn').addEventListener('click', resetAll);
            render();
            if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise(); }
        })();
    </script>
</body>
</html>
